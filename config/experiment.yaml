output_dir: "../outputs"
data_dir: "../datasets"

dataset_path_template: "{dataset}/1_{dataset}_Splitted_Datasets"

train_datasets: ["BGL", "HDFS"]
val_datasets: ["BGL", "HDFS"]
test_datasets: ["BGL", "HDFS"]

prediction_stage:
  predict_split: "test"
  predict_datasets: ["TH_a"]
  anomaly_threshold: 0.05

  threshold_search:
    enabled: true
    start: 0.01
    end: 0.50
    step: 0.01
    metric: "f1"

split_files:
  train: "train_df.pkl"
  val: "val_df.pkl"
  test: "test_df.pkl"

columns:
  timestamp: "Timestamp"
  template: "processed_EventTemplate"
  block_id: "Node_block_id"
  label: "Label"
  dataset: "DatasetName"

normalization:
  enabled: true
  lowercase: true
  replace_numbers: true
  replace_hex: true
  replace_paths: true
  replace_ips: true
  replace_block_ids: true

labels:
  normal_values: [0, "0", "Normal", "normal", "-"]
  anomaly_values: [1, "1", "Anomaly", "anomaly"]

model:
  teacher_name: "distilbert-base-uncased"
  student_name: "microsoft/MiniLM-L12-H384-uncased"
  max_length: 128
  batch_size: 16
  epochs: 3
  lr: 0.00002

mlm:
  enabled: true
  model_name: "distilbert-base-uncased"
  mlm_probability: 0.15
  batch_size: 16
  epochs: 2
  lr: 0.00005
  balance_datasets: true

  dapt:
    enabled: true
    datasets: ["BGL", "HDFS"]

  tapt:
    enabled: true
    datasets: ["TH_a"]

distillation:
  temperature: 1.0
  alpha: 0.9
  epochs: 3
  lr: 0.00002