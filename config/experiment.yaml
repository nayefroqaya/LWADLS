# ======================================================
# PATHS
# ======================================================
output_dir: "../outputs"
data_dir: "../datasets"

dataset_path_template: "{dataset}/1_{dataset}_Splitted_Datasets"

# ======================================================
# TRAINING STAGE (SOURCE DOMAIN)
# ======================================================
train_datasets: ["BGL", "HDFS"]
val_datasets: ["BGL", "HDFS"]
test_datasets: ["BGL", "HDFS"]

# ======================================================
# PREDICTION STAGE (TARGET DOMAIN)
# ======================================================
prediction_stage:
  predict_split: "test"
  predict_datasets: ["TH_1G"]
  anomaly_threshold: 0.5  # fallback if tuning disabled

# ======================================================
# DATA FILES
# ======================================================
split_files:
  train: "train_df.pkl"
  val: "val_df.pkl"
  test: "test_df.pkl"

# ======================================================
# COLUMN MAPPING
# ======================================================
columns:
  timestamp: "Timestamp"
  template: "processed_EventTemplate"
  block_id: "Node_block_id"
  label: "Label"
  dataset: "DatasetName"

# ======================================================
# LABELS
# ======================================================
labels:
  normal_values: [0, "0", "Normal", "normal", "-"]
  anomaly_values: [1, "1", "Anomaly", "anomaly"]

# ======================================================
# MODEL (STUDENT ONLY)
# ======================================================
model:
  student_name: "microsoft/MiniLM-L12-H384-uncased"
  max_length: 128
  batch_size: 16
  epochs: 3
  lr: 0.00002

# ======================================================
# MLM PRETRAINING (DAPT + TAPT)
# ======================================================
mlm:
  enabled: true
  model_name: "auto"   # use MiniLM automatically

  mlm_probability: 0.15
  batch_size: 16
  epochs: 2
  lr: 0.00005

  # ✅ CORRECT KEY (this fixes your issue)
  balance_datasets: true

  # -------- DAPT --------
  dapt:
    enabled: true
    datasets: ["BGL", "HDFS"]

  # -------- TAPT --------
  tapt:
    enabled: true
    datasets: ["TH_1G"]

# ======================================================
# TRAINING IMPROVEMENTS
# ======================================================
training:
  use_dataset_balanced_sampler: true
  use_class_weights: true

  class_weight_normal: 1.0
  class_weight_anomaly: 3.0

# ======================================================
# HYBRID SCORING
# ======================================================
hybrid_scoring:
  enabled: true

  # fallback values if tuning is disabled
  alpha_classifier: 0.8
  alpha_distance: 0.2

  reference_split: "train"
  reference_datasets: ["BGL", "HDFS"]
  normal_only: true

  # important: avoids HDFS dominating the normal centroid
  dataset_balanced_centroid: true

threshold_tuning:
  enabled: true
  split: "val"
  datasets: ["BGL", "HDFS"]

  threshold_start: 0.01
  threshold_end: 0.95
  threshold_step: 0.01

  alpha_search:
    enabled: true
    alpha_classifier_values: [1.0, 0.9, 0.8, 0.7, 0.6]