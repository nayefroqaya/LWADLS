data_root: "./datasets"
output_dir: "./outputs"

train_datasets: ["HDFS", "BGL"]
val_datasets:   ["HDFS", "BGL"]
test_datasets:  ["Spirit", "TH_a", "TH_b"]

file_names:
  train: "train.pkl"
  val:   "val.pkl"
  test:  "test.pkl"

columns:
  timestamp: "Timestamp"
  template: "processed_EventTemplate"
  block_id: "Node_block_id"
  label: "Label"

labels:
  normal_values: [0, "0", "Normal", "normal", "-"]
  anomaly_values: [1, "1", "Anomaly", "anomaly"]

model:
  teacher_name: "distilbert-base-uncased"
  student_name: "microsoft/MiniLM-L12-H384-uncased"
  max_length: 128
  batch_size: 16
  epochs: 3
  lr: 0.00002

mlm:
  enabled: true
  model_name: "distilbert-base-uncased"
  mlm_probability: 0.15
  batch_size: 16
  epochs: 2
  lr: 0.00005

distillation:
  temperature: 2.0
  alpha: 0.5
  epochs: 3
  lr: 0.00002