output_dir: "../outputs"
data_dir: "../datasets"

dataset_path_template: "{dataset}/1_{dataset}_Splitted_Datasets"

# =========================
# Training stage
# =========================
# For training, validation, and internal test.
# Keep test_datasets from the training domains.
train_datasets: ["BGL", "HDFS"]
val_datasets: ["BGL", "HDFS"]
test_datasets: ["BGL", "HDFS"]

# =========================
# Prediction stage
# =========================
# This is for final cross-dataset testing using saved models.
prediction_stage:
  predict_split: "test"
  predict_datasets: ["TH_1G"]
  anomaly_threshold: 0.3

split_files:
  train: "train_df.pkl"
  val: "val_df.pkl"
  test: "test_df.pkl"

columns:
  timestamp: "Timestamp"
  template: "processed_EventTemplate"
  block_id: "Node_block_id"
  label: "Label"
  dataset: "DatasetName"

labels:
  normal_values: [0, "0", "Normal", "normal", "-"]
  anomaly_values: [1, "1", "Anomaly", "anomaly"]

model:
  teacher_name: "distilbert-base-uncased"
  student_name: "microsoft/MiniLM-L12-H384-uncased"

  #teacher_name: "microsoft/deberta-v3-small"
  #student_name: "microsoft/MiniLM-L12-H384-uncased"

  max_length: 128
  batch_size: 16
  epochs: 3
  lr: 0.00002

mlm:
  enabled: true
  model_name: "distilbert-base-uncased"
  mlm_probability: 0.15
  batch_size: 16
  epochs: 2
  lr: 0.00005

distillation:
  temperature: 2.0
  alpha: 0.5
  epochs: 3
  lr: 0.00002