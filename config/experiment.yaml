# ======================================================
# PATHS
# ======================================================
output_dir: "../outputs"
data_dir: "../datasets"

dataset_path_template: "{dataset}/1_{dataset}_Splitted_Datasets"

# ======================================================
# TRAINING STAGE (SOURCE DOMAIN)
# ======================================================
train_datasets: ["BGL", "HDFS"]
val_datasets: ["BGL", "HDFS"]
test_datasets: ["BGL", "HDFS"]

# ======================================================
# PREDICTION STAGE (TARGET DOMAIN)
# ======================================================
prediction_stage:
  predict_split: "test"
  predict_datasets: ["TH_1G"]

  # fallback threshold if tuning disabled
  anomaly_threshold: 0.5

# ======================================================
# DATA FILES
# ======================================================
split_files:
  train: "train_df.pkl"
  val: "val_df.pkl"
  test: "test_df.pkl"

# ======================================================
# COLUMN MAPPING
# ======================================================
columns:
  timestamp: "Timestamp"
  template: "processed_EventTemplate"
  block_id: "Node_block_id"
  label: "Label"
  dataset: "DatasetName"

# ======================================================
# LABELS
# ======================================================
labels:
  normal_values: [0, "0", "Normal", "normal", "-"]
  anomaly_values: [1, "1", "Anomaly", "anomaly"]

# ======================================================
# MODEL (STUDENT ONLY)
# ======================================================
model:
  student_name: "microsoft/MiniLM-L12-H384-uncased"

  max_length: 128
  batch_size: 16
  epochs: 3
  lr: 0.00002

# ======================================================
# MLM PRETRAINING (DAPT + TAPT)
# ======================================================
mlm:
  enabled: true

  # IMPORTANT → auto = use student model (MiniLM)
  model_name: "auto"

  mlm_probability: 0.15
  batch_size: 16
  epochs: 2
  lr: 0.00005

  # -------- DAPT (source domain) --------
  dapt:
    enabled: true
    datasets: ["BGL", "HDFS"]

  # -------- TAPT (target domain) --------
  tapt:
    enabled: true
    datasets: ["TH_1G"]

  # -------- Balanced MLM sampling --------
  balanced_sampling: true

# ======================================================
# TRAINING IMPROVEMENTS
# ======================================================
training:
  # balance datasets (BGL vs HDFS)
  use_dataset_balanced_sampler: true

  # handle anomaly imbalance
  use_class_weights: true

  # you can tune these
  class_weight_normal: 1.0
  class_weight_anomaly: 3.0

# ======================================================
# HYBRID SCORING (KEY IMPROVEMENT)
# ======================================================
hybrid_scoring:
  enabled: true

  # combine classifier + embedding distance
  alpha_classifier: 0.7
  alpha_distance: 0.3

  # build reference from normal logs
  reference_split: "train"
  reference_datasets: ["BGL", "HDFS"]
  normal_only: true

# ======================================================
# THRESHOLD TUNING (CRITICAL)
# ======================================================
threshold_tuning:
  enabled: true

  # tune on source validation
  split: "val"
  datasets: ["BGL", "HDFS"]

  # search range
  start: 0.01
  end: 0.90
  step: 0.01

  # optimize anomaly detection
  metric: "f1"