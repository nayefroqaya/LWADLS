# ======================================================
# AdaLogSLM Clean Configuration
# Modes:
#   1) in_domain
#   2) fewshot_target_adaptation
# ======================================================

experiment:
  name: "AdaLogSLM_BGL_HDFS_to_TH_1G"
  mode: "fewshot_target_adaptation"   # options: ["in_domain", "fewshot_target_adaptation"]
  seed: 42
  output_dir: "../outputs/AdaLogSLM_BGL_HDFS_to_TH_1G"

# ======================================================
# PATHS
# ======================================================
paths:
  data_dir: "datasets"
  dataset_path_template: "{dataset}/1_{dataset}_Splitted_Datasets"

split_files:
  train: "train_df.pkl"
  val: "val_df.pkl"
  test: "test_df.pkl"

# ======================================================
# DATA COLUMNS
# ======================================================
columns:
  timestamp: "Timestamp"
  template: "processed_EventTemplate"
  block_id: "Node_block_id"
  label: "Label"
  dataset: "DatasetName"

# ======================================================
# LABEL MAPPING
# ======================================================
labels:
  normal_values: [0, "0", "Normal", "normal", "-"]
  anomaly_values: [1, "1", "Anomaly", "anomaly"]

# ======================================================
# DATASET MODES
# ======================================================
datasets:

  # ----------------------------------------------------
  # Mode 1: In-domain semi-supervised
  # Train: BGL normal
  # Test:  BGL normal + BGL anomaly
  # ----------------------------------------------------
  in_domain:
    dataset_name: "BGL"
    train_split: "train"
    val_split: "val"
    test_split: "test"

    train_normal_only: true
    val_normal_only: true
    test_normal_only: false

  # ----------------------------------------------------
  # Mode 2: Few-shot target adaptation
  # Source train: BGL + HDFS normal
  # Target adapt: small TH_1G normal
  # Target test:  TH_1G normal + TH_1G anomaly
  # ----------------------------------------------------
  fewshot_target_adaptation:
    source_datasets: ["BGL", "HDFS"]
    source_train_split: "train"

    target_dataset: "TH_1G"
    target_adapt_split: "train"
    target_val_split: "val"
    target_test_split: "test"

    target_adapt_normal_only: true
    target_val_normal_only: true
    target_test_normal_only: false

    # Few-shot target-normal adaptation.
    # 0.05 means use only 5% of target normal training sequences.
    target_normal_ratio: 0.10
    target_normal_max_samples: null

# ======================================================
# TEXT / SEQUENCE CONSTRUCTION
# ======================================================
text:
  input_column: "processed_EventTemplate"
  group_by_column: "Node_block_id"
  sort_by_timestamp: true
  event_separator: " [SEP] "

  max_events_per_sequence: 50
  min_events_per_sequence: 1

  lowercase: false
  mask_numbers: true
  mask_ips: true
  mask_paths: true

# ======================================================
# SMALL LANGUAGE MODEL
# ======================================================
model:
  student_name: "microsoft/MiniLM-L12-H384-uncased"
  max_length: 128
  projection_dim: 128
  dropout: 0.1

  # false = fine-tune SLM backbone + projection head
  # true  = freeze SLM backbone and train projection head only
  freeze_backbone: false

# ======================================================
# TRAINING
# ======================================================
training:
  device: "auto"
  batch_size: 16

  # Used in fewshot_target_adaptation mode.
  source_epochs: 3
  source_lr: 0.00002

  target_adapt_epochs: 2
  target_adapt_lr: 0.00001

  # Used in in_domain mode.
  in_domain_epochs: 3
  in_domain_lr: 0.00002

  weight_decay: 0.01
  gradient_clip_norm: 1.0
  center_loss_weight: 0.1

  # Useful when source datasets have different sizes.
  use_dataset_balanced_sampler: true
  balance_source_datasets: true

# ======================================================
# MASKED LANGUAGE MODELING
# ======================================================
mlm:
  enabled: true
  mlm_probability: 0.15

# ======================================================
# ANOMALY SCORING
# ======================================================
hybrid_scoring:
  enabled: true

  # Final anomaly score:
  # score = alpha_mlm * mlm_loss + beta_center * center_distance
  alpha_mlm: 0.7
  beta_center: 0.3

# ======================================================
# THRESHOLD
# ======================================================
threshold:
  method: "percentile"   # options: ["percentile", "mean_std", "fixed"]
  percentile: 85

prediction_stage:
  anomaly_threshold: 0.5   # used only if threshold.method = "fixed"

# ======================================================
# EVALUATION / OUTPUTS
# ======================================================
evaluation:
  save_predictions: true

outputs:
  save_model: true
  save_tokenizer: true
  save_config: true
  save_normal_center: true
  results_file: "results.json"
  predictions_file: "predictions.csv"